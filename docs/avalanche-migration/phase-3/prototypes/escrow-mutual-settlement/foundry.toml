# R12 / F14 LOCAL_SIMULATION-only contract variant. Not a deployable project: no script/, no manifest, no Fuji profile.
# The baseline in avalanche-contracts/src is NOT modified (O-2, O-5, CLAUDE.md section 6).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../../../../avalanche-contracts/lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=../../../../../avalanche-contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../../../../avalanche-contracts/lib/forge-std/src/",
  "@freelax/=../../../../../avalanche-contracts/src/",
]

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[fuzz]
runs = 256
