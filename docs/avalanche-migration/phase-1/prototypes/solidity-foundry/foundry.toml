[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"   # explicit: Avalanche docs say Cancun, not Pectra (see solidity-toolchain-evaluation.md)
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
