services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: payment-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 9190
      SPRING_PROFILES_ACTIVE: ${PAYMENT_SPRING_PROFILE:-dev}
      JWT_SECRET: ${PAYMENT_JWT_SECRET:?Set PAYMENT_JWT_SECRET in ignored .env}
      PAYMENT_DEMO_USER_PASSWORD: ${PAYMENT_DEMO_USER_PASSWORD:?Set PAYMENT_DEMO_USER_PASSWORD in ignored .env}
      DB_URL: jdbc:mysql://mysql:3306/payment?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
      INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY:?Set PAYMENT_INTERNAL_API_KEY in ignored .env}
    ports:
      - "127.0.0.1:9190:9190"

  marketplace-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: marketplace-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-backend:
        condition: service_started
      misa-backend:
        condition: service_started
    environment:
      SERVER_PORT: 9191
      SPRING_PROFILES_ACTIVE: ${MARKETPLACE_SPRING_PROFILE:-dev}
      JWT_SECRET: ${MARKETPLACE_JWT_SECRET:?Set MARKETPLACE_JWT_SECRET to the existing Marketplace signing secret}
      CORS_ALLOWED_ORIGINS: ${MARKETPLACE_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:?Set DEMO_CLIENT_PASSWORD in ignored .env}
      DEMO_FREELANCER_PASSWORD: ${DEMO_FREELANCER_PASSWORD:?Set DEMO_FREELANCER_PASSWORD in ignored .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      ESCROW_E2E_CLOCK_OFFSET_SECONDS: ${ESCROW_E2E_CLOCK_OFFSET_SECONDS:-0}
      PARTNER_MOCK_E2E_NEGOTIATION_SECONDS: ${PARTNER_MOCK_E2E_NEGOTIATION_SECONDS:-0}
      PAYMENT_FLOW_CUTOVER_ENABLED: ${PAYMENT_FLOW_CUTOVER_ENABLED:-false}
      DB_URL: jdbc:mysql://mysql:3306/marketplace?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 1
      PAYMENT_BACKEND_BASE_URL: http://payment-backend:9190
      PAYMENT_BACKEND_INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY:?Set PAYMENT_INTERNAL_API_KEY in ignored .env}
      MISA_BACKEND_BASE_URL: http://misa-backend:9192
      MISA_PLATFORM_ACCOUNT_EMAIL: ${MISA_PLATFORM_ACCOUNT_EMAIL:?Set MISA_PLATFORM_ACCOUNT_EMAIL in ignored .env}
      MISA_PLATFORM_ACCOUNT_PASSWORD: ${MISA_PLATFORM_ACCOUNT_PASSWORD:?Set MISA_PLATFORM_ACCOUNT_PASSWORD in ignored .env}
      MISA_CERTIFICATE_AUTO_ISSUE: ${MISA_CERTIFICATE_AUTO_ISSUE:-true}
      MISA_CERTIFICATE_AUTO_SUBMIT: ${MISA_CERTIFICATE_AUTO_SUBMIT:-true}
      SOLANA_CPR_BASE_URL: http://solana-integration:9193
      SOLANA_CPR_INTERNAL_API_KEY: ${SOLANA_INTERNAL_API_KEY:-}
      SOLANA_CPR_CUSTODIAL_CLIENT_PUBLIC_KEY: ${SOLANA_CUSTODIAL_CLIENT_PUBLIC_KEY:-}
      SOLANA_CPR_ONRAMP_AUTHORITY_PUBLIC_KEY: ${SOLANA_ONRAMP_AUTHORITY_PUBLIC_KEY:-}
      SOLANA_CPR_NETWORK: ${SOLANA_NETWORK:-localnet}
      # R13: the Solana gateway is not in master (branch solana); Solana calls fail closed unless this is true
      SOLANA_CPR_ENABLED: ${SOLANA_CPR_ENABLED:-false}
      SOLANA_CPR_COMMITMENT: ${SOLANA_COMMITMENT:-confirmed}
      LOCAL_WALLET_ENCRYPTION_KEY: ${LOCAL_WALLET_ENCRYPTION_KEY:-}
      EXCHANGE_RATE_ALLOW_FALLBACK: ${EXCHANGE_RATE_ALLOW_FALLBACK:-true}
      DEMO_CLIENT_SOLANA_PUBLIC_KEY: ${SOLANA_CUSTODIAL_CLIENT_PUBLIC_KEY:-}
      DEMO_FREELANCER_SOLANA_PUBLIC_KEY: ${DEMO_FREELANCER_SOLANA_PUBLIC_KEY:-}
      SOLANA_LOCAL_PRIVATE_KEYS: ${SOLANA_LOCAL_PRIVATE_KEYS:-}
      # Avalanche rail of the marketplace (development simulation). Owner decision 2026-11-12: Avalanche is the default rail of new
      # contracts and the rail is on; the gateway service below must run (profile avalanche) for funding and the other chain actions.
      MARKETPLACE_PRIMARY_RAIL: ${MARKETPLACE_PRIMARY_RAIL:-AVALANCHE}
      AVALANCHE_GATEWAY_ENABLED: ${AVALANCHE_GATEWAY_ENABLED:-true}
      AVALANCHE_GATEWAY_BASE_URL: ${AVALANCHE_GATEWAY_BASE_URL:-http://avalanche-integration:9194}
      AVALANCHE_GATEWAY_INTERNAL_API_KEY: ${AVALANCHE_INTERNAL_API_KEY:-}
      AVALANCHE_GATEWAY_NETWORK: ${AVALANCHE_GATEWAY_NETWORK:-avalanche-local}
      AVALANCHE_GATEWAY_SETTLEMENT_NOTIFICATIONS: ${AVALANCHE_GATEWAY_SETTLEMENT_NOTIFICATIONS:-false}
      AVALANCHE_PAYOUT_ENABLED: ${AVALANCHE_PAYOUT_ENABLED:-false}
      AVALANCHE_PAYOUT_PARTNER: ${AVALANCHE_PAYOUT_PARTNER:-none}
      AVALANCHE_PAYOUT_LOCAL_MOCK_TOKEN_ADDRESS: ${AVALANCHE_PAYOUT_LOCAL_MOCK_TOKEN_ADDRESS:-}
      AVALANCHE_PAYOUT_LOCAL_MOCK_DEPOSIT_ADDRESS: ${AVALANCHE_PAYOUT_LOCAL_MOCK_DEPOSIT_ADDRESS:-0x00000000000000000000000000000000000c0ffe}
    ports:
      - "127.0.0.1:9191:9191"

  misa-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: misa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 9192
      SPRING_PROFILES_ACTIVE: ${MISA_SPRING_PROFILE:-dev}
      JWT_SECRET: ${MISA_JWT_SECRET:?Set MISA_JWT_SECRET in ignored .env}
      MISA_PLATFORM_ACCOUNT_EMAIL: ${MISA_PLATFORM_ACCOUNT_EMAIL:?Set MISA_PLATFORM_ACCOUNT_EMAIL in ignored .env}
      MISA_PLATFORM_ACCOUNT_PASSWORD: ${MISA_PLATFORM_ACCOUNT_PASSWORD:?Set MISA_PLATFORM_ACCOUNT_PASSWORD in ignored .env}
      DB_URL: jdbc:mysql://mysql:3306/misa?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
    ports:
      - "127.0.0.1:9192:9192"

  # Avalanche development simulation gateway (LOCAL_SIMULATION / AVALANCHE_FUJI only). Opt-in: docker compose --profile avalanche up.
  # No default environment: blank values make the service refuse to start. Mainnet cannot be configured.
  avalanche-integration:
    profiles: ["avalanche"]
    build:
      context: .
      dockerfile: Dockerfile.avalanche
    restart: unless-stopped
    environment:
      SERVER_PORT: 9194
      AVALANCHE_ENVIRONMENT: ${AVALANCHE_ENVIRONMENT:-}
      AVALANCHE_RPC_PRIMARY_URL: ${AVALANCHE_RPC_PRIMARY_URL:-}
      AVALANCHE_RPC_SECONDARY_URL: ${AVALANCHE_RPC_SECONDARY_URL:-}
      # RPC pacing and timeout; the defaults are the application defaults (1 s gap protects public endpoints, use 0 for a local Anvil).
      AVALANCHE_RPC_MIN_GAP_MS: ${AVALANCHE_RPC_MIN_GAP_MS:-1000}
      AVALANCHE_RPC_TIMEOUT_MS: ${AVALANCHE_RPC_TIMEOUT_MS:-10000}
      # Opt-in features, off by default. Signers exist only in LOCAL_SIMULATION; tracking needs a local MySQL database
      # named avalanche_gateway that the operator provisions (blank values make the service refuse to enable it).
      AVALANCHE_SIGNERS_ENABLED: ${AVALANCHE_SIGNERS_ENABLED:-false}
      AVALANCHE_TX_ENABLED: ${AVALANCHE_TX_ENABLED:-false}
      AVALANCHE_DB_URL: ${AVALANCHE_DB_URL:-}
      AVALANCHE_DB_USERNAME: ${AVALANCHE_DB_USERNAME:-}
      AVALANCHE_DB_PASSWORD: ${AVALANCHE_DB_PASSWORD:-}
      # Periodic reconciliation of gateway-submitted transactions and periodic log scans; 0 (default) disables the loop.
      AVALANCHE_TX_RECONCILE_INTERVAL_MS: ${AVALANCHE_TX_RECONCILE_INTERVAL_MS:-0}
      AVALANCHE_SCAN_INTERVAL_MS: ${AVALANCHE_SCAN_INTERVAL_MS:-0}
      AVALANCHE_SCAN_ENABLED: ${AVALANCHE_SCAN_ENABLED:-false}
      AVALANCHE_SCAN_CONTRACT_ADDRESS: ${AVALANCHE_SCAN_CONTRACT_ADDRESS:-}
      AVALANCHE_SCAN_WS_URL: ${AVALANCHE_SCAN_WS_URL:-}
      AVALANCHE_DEPLOYMENT_MANIFEST: ${AVALANCHE_DEPLOYMENT_MANIFEST:-}
      AVALANCHE_INTERNAL_API_KEY: ${AVALANCHE_INTERNAL_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9194:9194"
    volumes:
      - ./avalanche-contracts/deployments:/deployments:ro

  frontend:
    profiles: ["deploy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MARKETPLACE_API_ORIGIN: ${VITE_MARKETPLACE_API_ORIGIN:-}
        VITE_SOLANA_CLUSTER: ${VITE_SOLANA_CLUSTER:-localnet}
        VITE_AVALANCHE_ENABLED: ${VITE_AVALANCHE_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      marketplace-backend:
        condition: service_started
    environment:
      FREELAX_SITE_ADDRESS: ${FREELAX_SITE_ADDRESS:-:80}
    ports:
      - "${FREELAX_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${FREELAX_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
