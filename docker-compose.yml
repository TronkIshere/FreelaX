services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: payment-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 9190
      DB_URL: jdbc:mysql://mysql:3306/payment?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
      INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY:-dev-only-payment-internal-key}
    ports:
      - "127.0.0.1:9190:9190"

  marketplace-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: marketplace-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-backend:
        condition: service_started
      misa-backend:
        condition: service_started
      solana-integration:
        condition: service_started
    environment:
      SERVER_PORT: 9191
      SPRING_PROFILES_ACTIVE: ${MARKETPLACE_SPRING_PROFILE:-dev}
      JWT_SECRET: ${MARKETPLACE_JWT_SECRET:?Set MARKETPLACE_JWT_SECRET to the existing Marketplace signing secret}
      CORS_ALLOWED_ORIGINS: ${MARKETPLACE_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_URL: jdbc:mysql://mysql:3306/marketplace?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 1
      PAYMENT_BACKEND_BASE_URL: http://payment-backend:9190
      PAYMENT_BACKEND_INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY:-dev-only-payment-internal-key}
      MISA_BACKEND_BASE_URL: http://misa-backend:9192
      MISA_PLATFORM_ACCOUNT_EMAIL: ${MISA_PLATFORM_ACCOUNT_EMAIL:-platform@marketplace.local}
      MISA_PLATFORM_ACCOUNT_PASSWORD: ${MISA_PLATFORM_ACCOUNT_PASSWORD:-MisaPlatform@2026}
      MISA_CERTIFICATE_AUTO_ISSUE: ${MISA_CERTIFICATE_AUTO_ISSUE:-true}
      MISA_CERTIFICATE_AUTO_SUBMIT: ${MISA_CERTIFICATE_AUTO_SUBMIT:-true}
      SOLANA_CPR_BASE_URL: http://solana-integration:9193
      SOLANA_CPR_INTERNAL_API_KEY: ${SOLANA_INTERNAL_API_KEY:-dev-only-solana-internal-key}
      SOLANA_CPR_CUSTODIAL_CLIENT_PUBLIC_KEY: ${SOLANA_CUSTODIAL_CLIENT_PUBLIC_KEY:-}
      SOLANA_CPR_ONRAMP_AUTHORITY_PUBLIC_KEY: ${SOLANA_ONRAMP_AUTHORITY_PUBLIC_KEY:-}
      SOLANA_CPR_NETWORK: ${SOLANA_NETWORK:-localnet}
      SOLANA_CPR_COMMITMENT: ${SOLANA_COMMITMENT:-confirmed}
      DEMO_CLIENT_SOLANA_PUBLIC_KEY: ${SOLANA_CUSTODIAL_CLIENT_PUBLIC_KEY:-}
      DEMO_FREELANCER_SOLANA_PUBLIC_KEY: ${DEMO_FREELANCER_SOLANA_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:9191:9191"

  misa-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: misa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 9192
      DB_URL: jdbc:mysql://mysql:3306/misa?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
    ports:
      - "127.0.0.1:9192:9192"

  solana-integration:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: solana-integration
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 9193
      DB_URL: jdbc:mysql://mysql:3306/solana_gateway?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SOLANA_RPC_HTTP_URL: ${SOLANA_RPC_HTTP_URL:-http://host.docker.internal:9123}
      SOLANA_PROGRAM_ID: ${SOLANA_PROGRAM_ID:-4Wd6umju26vej2ftzwR6J55pjkUqDQsxfVkt46UqDb1b}
      SOLANA_COMMITMENT: ${SOLANA_COMMITMENT:-confirmed}
      SOLANA_SYSTEM_FEE_PAYER: ${SOLANA_SYSTEM_FEE_PAYER:-}
      SOLANA_INTERNAL_API_KEY: ${SOLANA_INTERNAL_API_KEY:-dev-only-solana-internal-key}
      SOLANA_LOCAL_PRIVATE_KEYS: ${SOLANA_LOCAL_PRIVATE_KEYS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9193:9193"

  frontend:
    profiles: ["deploy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MARKETPLACE_API_ORIGIN: ${VITE_MARKETPLACE_API_ORIGIN:-}
    restart: unless-stopped
    depends_on:
      marketplace-backend:
        condition: service_started
    environment:
      FREELAX_SITE_ADDRESS: ${FREELAX_SITE_ADDRESS:-:80}
    ports:
      - "${FREELAX_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${FREELAX_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
