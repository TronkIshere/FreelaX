services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: payment-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - payment-backend/.env
    environment:
      SERVER_PORT: 9190
      DB_URL: jdbc:mysql://mysql:3306/payment?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
    ports:
      - "9190:9190"

  marketplace-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: marketplace-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-backend:
        condition: service_started
    env_file:
      - marketplace-backend/.env
    environment:
      SERVER_PORT: 9191
      DB_URL: jdbc:mysql://mysql:3306/marketplace?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 1
      PAYMENT_BACKEND_BASE_URL: http://payment-backend:9190
    ports:
      - "9191:9191"

  misa-backend:
    build:
      context: .
      dockerfile: Dockerfile.maven
      args:
        MODULE: misa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - misa-backend/.env
    environment:
      SERVER_PORT: 9192
      DB_URL: jdbc:mysql://mysql:3306/misa?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
    ports:
      - "9192:9192"

volumes:
  mysql-data: