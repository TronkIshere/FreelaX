spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.payment.backend: INFO
    org.springframework.security: WARN

bofa:
  checkout:
    base-url: ${BOFA_BASE_URL:https://api-m.paypal.com}