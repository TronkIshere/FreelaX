server:
  port: ${SERVER_PORT:9190}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

spring:
  application:
    name: paypal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    username: ${DB_USERNAME:paypal}
    password: ${DB_PASSWORD:paypal}
    url: ${DB_URL:jdbc:mysql://localhost:3307/paypal?useUnicode=true&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

internal:
  api:
    key: ${INTERNAL_API_KEY}

paypal:
  fee:
    commercial-fee-rate: ${PAYPAL_FEE_RATE:0.044}
    fixed-fee-usd: ${PAYPAL_FIXED_FEE_USD:0.30}
    fx-spread-rate: ${PAYPAL_FX_SPREAD:0.035}
  checkout:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    currency: ${PAYPAL_CURRENCY:USD}
    return-url: ${PAYPAL_RETURN_URL:http://localhost:${server.port:9190}/api/v1/paypal/checkout/return}
    cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:${server.port:9190}/api/v1/paypal/checkout/cancel}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.paypal.backend: INFO
    org.springframework.security: WARN