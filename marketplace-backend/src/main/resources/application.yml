server:
  port: ${SERVER_PORT:9191}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

spring:
  application:
    name: marketplace-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    url: ${DB_URL:jdbc:mysql://localhost:3307/marketplace?useUnicode=true&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

payment-backend:
  base-url: ${PAYMENT_BACKEND_BASE_URL:http://localhost:9190}
  internal-api-key: ${PAYMENT_BACKEND_INTERNAL_API_KEY:}

misa-backend:
  base-url: ${MISA_BACKEND_BASE_URL:http://localhost:9192}
  platform-account-email: ${MISA_PLATFORM_ACCOUNT_EMAIL:platform@marketplace.local}
  platform-account-password: ${MISA_PLATFORM_ACCOUNT_PASSWORD:MisaPlatform@2026}
  certificate:
    auto-issue: ${MISA_CERTIFICATE_AUTO_ISSUE:false}
    auto-submit: ${MISA_CERTIFICATE_AUTO_SUBMIT:false}
    digital-certificate-serial: ${MISA_DIGITAL_CERTIFICATE_SERIAL:CERT-ABC-2026}
    signature-mode: DIGITAL_SIGNATURE
    submission-mode: ELECTRONIC

tax-certificate:
  sync-initial-delay-ms: 60000
  sync-interval-ms: 300000

solana-cpr:
  base-url: ${SOLANA_CPR_BASE_URL:http://localhost:9193}
  internal-api-key: ${SOLANA_CPR_INTERNAL_API_KEY:}
  custodial-client-public-key: ${SOLANA_CPR_CUSTODIAL_CLIENT_PUBLIC_KEY:}
  onramp-authority-public-key: ${SOLANA_CPR_ONRAMP_AUTHORITY_PUBLIC_KEY:}
  network: ${SOLANA_CPR_NETWORK:localnet}
  commitment: ${SOLANA_CPR_COMMITMENT:confirmed}
  connect-timeout-ms: 3000
  read-timeout-ms: 15000
  confirm-poll-attempts: 10
  confirm-poll-interval-ms: 1000
  pending-expiry-seconds: 300
  invoice-validity-seconds: 900

demo:
  wallet:
    client-public-key: ${DEMO_CLIENT_SOLANA_PUBLIC_KEY:}
    freelancer-public-key: ${DEMO_FREELANCER_SOLANA_PUBLIC_KEY:}

http-client:
  connect-timeout-ms: 3000
  read-timeout-ms: 10000

payout:
  reconcile-initial-delay-ms: 30000
  reconcile-interval-ms: 30000

internal:
  api:
    key: ${INTERNAL_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.marketplace.backend: INFO

exchange-rate:
  fallback-usd-vnd-rate: 25000
  fallback-usdc-vnd-rate: 25000
  cache-ttl-seconds: 60

onramp:
  fee-rate: 0.005   # 0.5% phí giả lập on-ramp (USD -> USDC)

offramp:
  fee-rate: 0.003   # 0.3% phí giả lập off-ramp (USDC -> VND)

certificate-pdf:
  payer-name: CÔNG TY CỔ PHẦN FREELAX VIỆT NAM
  payer-tax-code: "0109876543"
  payer-address: Tầng 8, 22 Láng Hạ, Đống Đa, Hà Nội
  payer-phone: 024 3456 7890
  income-type: Thu nhập từ tiền lương, tiền công
  lookup-url: http://localhost:9192/api/v1/withholding-certificates/lookup/{code}
