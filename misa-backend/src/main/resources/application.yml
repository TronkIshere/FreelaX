server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

spring:
  application:
    name: misa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    username: ${DB_USERNAME:misa}
    password: ${DB_PASSWORD:misa}
    url: ${DB_URL:jdbc:mysql://localhost:3307/misa?useUnicode=true&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

misa:
  organization:
    id: ${MISA_ORG_ID:ORG-000001}
    name: ${MISA_ORG_NAME:VIET FREELANCE PLATFORM JSC}
    tax-code: ${MISA_ORG_TAX_CODE:0312345678}
    address: ${MISA_ORG_ADDRESS:Ho Chi Minh City, Vietnam}
    phone: ${MISA_ORG_PHONE:02812345678}
    tax-authority: ${MISA_ORG_TAX_AUTHORITY:THUE_TP_HCM}
  signing:
    certificate-serial: ${MISA_CERT_SERIAL:CERT-ABC-2026}
  tax:
    withholding-rate: ${MISA_WITHHOLDING_RATE:0.10}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.misa.backend: INFO
    org.springframework.security: WARN
